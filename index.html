<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-image: url('prueba.jpeg'); /* Nombre de tu imagen de fondo */
    background-size: cover; /* Hace que la imagen cubra toda la pantalla */
    background-position: center; /* Centra la imagen */
    color: #333333;
    text-align: center;
    padding: 50px;
    
}
        h1 {
            color: #0066cc;
        }
        .tarjeta {
            
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
    </style>
</head>
<body>
<body>
    <div class="tarjeta">
        <img src="exp.jpeg" alt="Foto de prueba" width="150">
        <h1>¡El amor de mi vida!</h1>
        <p>boton de ver quien ama mas.</p>
        
        <!-- Agregamos el botón y el contador aquí -->
        <button id="mi-boton">¡Haz clic aquí!</button>
        <p>Has hecho clic <span id="contador">0</span> veces.</p>
    </div>


</body>
<script>
        let clicks = 0;
        const boton = document.getElementById('mi-boton');
        const contador = document.getElementById('contador');

        boton.addEventListener('click', function() {
            clicks++;
            contador.textContent = clicks;
        });
    </script>
</body>
</html>
